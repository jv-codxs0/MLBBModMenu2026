<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MLBB 2026 | M-Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@500;700&display=swap');
        
        :root { 
            --ml-blue: #0066ff; 
            --ml-dark: #050b18; 
        }

        body { 
            background-color: var(--ml-dark); 
            color: white; 
            font-family: 'Rajdhani', sans-serif; 
            margin: 0;
            overflow: hidden;
        }

        /* LOADING SCREEN WITH "M" ICON */
        #loader {
            position: fixed;
            inset: 0;
            background: #050b18;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 0.4s ease;
        }

        .m-logo {
            font-family: 'Orbitron', sans-serif;
            font-size: 5rem;
            font-weight: 700;
            color: var(--ml-blue);
            line-height: 1;
            margin-bottom: 0.5rem;
            filter: drop-shadow(0 0 15px rgba(0, 102, 255, 0.6));
            animation: pulse-m 1.5s infinite ease-in-out;
        }

        @keyframes pulse-m {
            0%, 100% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.1); opacity: 1; text-shadow: 0 0 20px rgba(0, 102, 255, 0.8); }
        }

        .loading-text {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.7rem;
            letter-spacing: 0.5em;
            color: rgba(255, 255, 255, 0.6);
            text-transform: uppercase;
        }

        /* DASHBOARD UI */
        #main-content { 
            opacity: 0; 
            height: 100vh;
            overflow-y: auto;
            transition: opacity 0.5s ease;
        }

        .ready #main-content { opacity: 1; }

        .glass { 
            background: rgba(255, 255, 255, 0.03); 
            backdrop-filter: blur(15px); 
            border: 1px solid rgba(255, 255, 255, 0.08); 
        }

        .btn-blue { 
            background: linear-gradient(90deg, #0066ff, #00ccff); 
            clip-path: polygon(5% 0, 100% 0, 95% 100%, 0% 100%);
            transition: all 0.3s ease;
        }

        .btn-blue:hover { 
            transform: scale(1.02);
            box-shadow: 0 0 25px rgba(0, 102, 255, 0.5);
        }

        .btn-alt {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            clip-path: polygon(5% 0, 100% 0, 95% 100%, 0% 100%);
            transition: all 0.3s ease;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background: #10b981;
            border-radius: 50%;
            display: inline-block;
            box-shadow: 0 0 8px #10b981;
        }
    </style>
</head>
<body>

    <!-- LOADING SCREEN -->

                </div>
            </div>

            <!-- DOWNLOAD CARD -->
            <div class="glass p-8 rounded-[2.5rem] shadow-2xl space-y-5 text-center">
                <div class="space-y-1 pb-4">

                    <span class="text-[10px] font-bold uppercase">Anti-Ban</span>
                </div>
            </div>

        </div>

    </div>

                loader.style.opacity = '0';

</body>
</html>
