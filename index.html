<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MLBB 2026 | Direct Download Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@300;500;700&display=swap');
        :root { --ml-blue: #0066ff; --ml-dark: #050b18; }
        body { background-color: var(--ml-dark); color: white; font-family: 'Rajdhani', sans-serif; overflow: hidden; margin: 0; }
        .font-orbitron { font-family: 'Orbitron', sans-serif; }
        
        /* LOADING SCREEN */
        #loader {
            position: fixed;
            inset: 0;
            background: #050b18;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 0.5s ease-out;
        }

        .logo-container {
            width: 120px;
            height: 120px;
            position: relative;
            margin-bottom: 20px;
        }

        /* Minimal MLBB Style 'M' Shield Logo */
        .ml-logo-svg {
            width: 100%;
            height: 100%;
            fill: var(--ml-blue);
            filter: drop-shadow(0 0 15px rgba(0, 102, 255, 0.6));
            animation: pulse 2s infinite ease-in-out;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); filter: drop-shadow(0 0 15px rgba(0, 102, 255, 0.6)); }
            50% { transform: scale(1.08); filter: drop-shadow(0 0 25px rgba(0, 102, 255, 0.8)); }
        }

        .progress-box {
            width: 240px;
            height: 4px;
            background: rgba(255,255,255,0.05);
            border-radius: 2px;
            overflow: hidden;
            margin-top: 10px;
        }

        #bar {
            width: 0%;
            height: 100%;
            background: #0066ff;
            box-shadow: 0 0 10px #0066ff;
            transition: width 0.1s linear;
        }

        /* MAIN CONTENT */
        #main-content { opacity: 0; pointer-events: none; transition: opacity 0.8s ease; }
        .ready #main-content { opacity: 1; pointer-events: auto; }
        .ready body { overflow-y: auto; }

        .glass { background: rgba(255, 255, 255, 0.02); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.05); }
        .btn-download { 
            background: linear-gradient(90deg, #0066ff, #00ccff); 
            clip-path: polygon(4% 0, 100% 0, 96% 100%, 0% 100%);
            transition: 0.3s;
        }
        .btn-download:hover { transform: translateY(-2px); box-shadow: 0 5px 20px rgba(0, 102, 255, 0.4); }
    </style>
</head>
<body class="min-h-screen">

    <!-- SPLASH LOADING SCREEN -->
    <div id="loader">
        <div class="logo-container">
            <svg class="ml-logo-svg" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                <!-- Shield Path -->
                <path d="M50 5 L15 20 L15 50 C15 75 50 95 50 95 C50 95 85 75 85 50 L85 20 L50 5 Z" fill="none" stroke="#0066ff" stroke-width="2"/>
                <!-- Minimal M Shape -->
                <path d="M30 40 L30 70 M70 40 L70 70 M30 40 L50 60 L70 40" stroke="white" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
                <path d="M30 40 L30 70 M70 40 L70 70 M30 40 L50 60 L70 40" stroke="#0066ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.5"/>
            </svg>
        </div>
        
        <p class="font-orbitron text-xs tracking-[0.4em] font-bold text-gray-400 uppercase">Loading</p>
        
        <div class="progress-box">
            <div id="bar"></div>
        </div>
        <p id="pct" class="mt-2 text-[10px] font-orbitron text-gray-600">0%</p>
    </div>

    <!-- MAIN DASHBOARD -->
    <div id="main-content">
        <nav class="fixed w-full z-50 glass h-20 flex items-center px-8">
            <div class="max-w-7xl mx-auto w-full flex justify-between items-center">
                <div class="flex items-center gap-2">
                    <i class="fas fa-bolt text-blue-500"></i>
                    <span class="font-orbitron font-bold text-lg">MLBB <span class="text-blue-500">2026</span></span>
                </div>
                <div class="font-orbitron text-[10px] font-bold uppercase tracking-widest text-blue-500">
                    V4.2.0 PRO ACTIVE
                </div>
            </div>
        </nav>

        <main class="pt-32 pb-20 px-6 max-w-xl mx-auto">
            <div class="glass p-10 rounded-[2.5rem] border-t-2 border-blue-600 shadow-2xl space-y-8 text-center">
                <div class="space-y-1">
                    <h1 class="text-4xl font-orbitron font-bold">MLBB MOD MENU</h1>
                    <p class="text-gray-500 text-sm tracking-widest uppercase">Season 31 • Anti-Ban 2.0</p>
                </div>

                <div class="grid grid-cols-2 gap-4 py-4">
                    <div class="bg-black/30 p-4 rounded-2xl border border-white/5">
                        <p class="text-[9px] text-gray-500 uppercase font-bold">Version</p>
                        <p class="text-blue-400 font-bold">V4.2.0</p>
                    </div>
                    <div class="bg-black/30 p-4 rounded-2xl border border-white/5">
                        <p class="text-[9px] text-gray-500 uppercase font-bold">Size</p>
                        <p class="text-blue-400 font-bold">142.8 MB</p>
                    </div>
                </div>

                <button onclick="directDownload()" class="btn-download w-full py-6 text-2xl font-bold font-orbitron uppercase italic flex items-center justify-center gap-3">
                    <i class="fas fa-download text-sm"></i> Download Now
                </button>

                <div class="flex justify-center gap-6 text-gray-500 text-[10px] font-bold uppercase tracking-tighter">
                    <span><i class="fas fa-check-circle text-green-500 mr-1"></i> Drone View</span>
                    <span><i class="fas fa-check-circle text-green-500 mr-1"></i> ESP Line</span>
                    <span><i class="fas fa-check-circle text-green-500 mr-1"></i> Unlock FPS</span>
                </div>
            </div>
        </main>
    </div>

    <script>
        // Progress Bar Simulation
        window.addEventListener('load', () => {
            const bar = document.getElementById('bar');
            const pctText = document.getElementById('pct');
            const loader = document.getElementById('loader');
            let progress = 0;

            const timer = setInterval(() => {
                progress += Math.random() * 8;
                if (progress >= 100) {
                    progress = 100;
                    clearInterval(timer);
                    setTimeout(() => {
                        loader.style.opacity = '0';
                        setTimeout(() => {
                            loader.style.display = 'none';
                            document.body.classList.add('ready');
                        }, 500);
                    }, 400);
                }
                bar.style.width = progress + '%';
                pctText.innerText = Math.floor(progress) + '%';
            }, 80);
        });

        function directDownload() {
            const id = '173n6LOfeSKB7CGXLEGrvAtOoRObv36CH';
            // Force direct download bypassing drive preview
            window.location.href = `https://drive.usercontent.google.com/download?id=${id}&export=download&confirm=t`;
        }
    </script>
</body>
</html>
